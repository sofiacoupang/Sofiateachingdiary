<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sofia 教學管理</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#352c3c;background:#faf7fb}*{box-sizing:border-box}body{margin:0}header{background:#735b85;color:white;padding:23px 18px 17px}header h1{font-size:22px;margin:0 0 5px}header small{opacity:.85}.wrap{max-width:850px;margin:auto;padding:15px 14px 100px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap;flex:1}.card{background:white;border:1px solid #e7dfea;border-radius:17px;padding:16px;margin-bottom:12px;box-shadow:0 3px 12px #32213c09}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:10px 0}button,input,select,textarea{font:inherit}button{border:0;background:#eae1f0;color:#4e365f;border-radius:10px;padding:10px 12px;cursor:pointer}button.primary{background:#735b85;color:white}button.danger{background:#ffe7e8;color:#9b3b48}button.small{font-size:13px;padding:7px 9px}button.active{background:#735b85;color:white}input,select,textarea{border:1px solid #d8cddd;border-radius:9px;padding:10px;background:white;min-width:0;width:100%}label{font-size:13px;color:#63546b;display:block;margin:9px 0 4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{background:#f3edf6;padding:13px;border-radius:12px}.stat b{display:block;font-size:20px;margin-top:5px}.muted{color:#82788a;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.student{border-top:1px solid #eee7f0;padding:12px 0}.student:first-of-type{border-top:0}.pill{display:inline-block;border-radius:12px;background:#f0e8f4;padding:4px 8px;font-size:12px}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.days button{padding:11px 0}.hidden{display:none}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.actions button{font-size:12px}.stamps{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0}.stamp{aspect-ratio:1;border-radius:50%;border:1px solid #cdbcd5;display:grid;place-items:center;font-size:11px}.stamp.on{background:#8d739e;color:white}.note{font-size:12px;color:#76667c;line-height:1.6}.full{grid-column:1/-1}input[type=checkbox]{width:auto}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#3f3349;color:white;padding:10px 17px;border-radius:10px;display:none;z-index:9}@media(max-width:420px){.three{grid-template-columns:1fr 1fr}.stat b{font-size:17px}.tabs button{padding:10px 9px;font-size:13px}}</style></head><body><header><div style="max-width:850px;margin:auto"><h1>♪ Sofia 教學管理</h1><small>鋼琴 · 跆拳道 · 身體開發｜課表、學費與課堂紀錄</small></div></header><main class="wrap"><nav class="tabs" id="tabs"><button data-tab="today" class="active">課表點名</button><button data-tab="students">學生管理</button><button data-tab="money">收入統計</button><button data-tab="stamps">獎勵印章</button><button data-tab="backup">備份</button></nav><div id="view"></div></main><div id="toast"></div><script>
const KEY='sofia-teaching-v1';const weekdays=['日','一','二','三','四','五','六'];const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const today=iso(new Date());let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.students))state={students:[],lessons:[],payments:[],stampEvents:[]};state.lessons??=[];state.payments??=[];state.stampEvents??=[];state.courseTypes??=['鋼琴','跆拳道','身體開發'];state.groupNotes??={};let tab='today',date=today,month=today.slice(0,7),editId=null,selectedStudent=null;const $=id=>document.getElementById(id),money=n=>'NT$ '+Math.round(n||0).toLocaleString('en-US');const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('目前的檔案預覽不允許儲存資料，請改用 Safari 正式網址開啟。')}}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function notify(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2100)}function student(id){return state.students.find(s=>s.id===id)}
function courseName(s){return s.subcourse?`${s.type}／${s.subcourse}`:s.type}
function courseOptions(current){return [...new Set([...state.courseTypes,...state.students.map(s=>s.type),current].filter(Boolean))].map(t=>`<option value="${escapeHtml(t)}" ${t===current?'selected':''}>${escapeHtml(t)}</option>`).join('')}
function addCourseType(){const name=prompt('新增課程大類名稱（例如：音樂創作）');if(!name?.trim())return;const v=name.trim();if(!state.courseTypes.includes(v))state.courseTypes.push(v);save();render()}
function renameCourseType(old){const name=prompt('修改課程大類名稱',old);if(!name?.trim()||name.trim()===old)return;const v=name.trim();if(state.courseTypes.includes(v))return alert('此名稱已存在');state.courseTypes=state.courseTypes.map(x=>x===old?v:x);state.students.forEach(x=>{if(x.type===old)x.type=v});save();render()}
function removeCourseType(old){if(state.students.some(x=>x.type===old))return alert('這個類別已有學生，請先將學生改到其他類別');if(!confirm(`確定移除「${old}」課程類別？`))return;state.courseTypes=state.courseTypes.filter(x=>x!==old);save();render()}
function noteKey(d,s){return JSON.stringify([d,s.type,s.subcourse||''])}
function savePersonalNote(id){const el=$('personalNote-'+id);if(!el)return;let l=lessonFor(id,date);if(!l){l={id:uid(),studentId:id,date,status:'pending',fee:student(id).fee};state.lessons.push(l)}l.note=el.value;save();notify('個人備忘錄已儲存')}
function saveGroupNote(key,elementId){const el=$(elementId);if(!el)return;state.groupNotes[key]=el.value;save();notify('團體備忘錄已儲存')}
function lessonFor(id,d){return state.lessons.find(l=>l.studentId===id&&l.date===d)}function planned(d){const day=new Date(d+'T12:00:00').getDay();return state.students.filter(s=>s.active!==false&&s.days.includes(day)).map(s=>({s,l:lessonFor(s.id,d),fixed:true})).concat(state.lessons.filter(l=>l.date===d&&!student(l.studentId)?.days.includes(day)).map(l=>({s:student(l.studentId),l,fixed:false})).filter(x=>x.s))}function actual(d){return planned(d).filter(x=>x.l?.status==='present').length}function changeTab(t){tab=t;render()}$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){editId=null;changeTab(b.dataset.tab)}};function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('view').innerHTML=({today:renderToday,students:renderStudents,money:renderMoney,stamps:renderStamps,backup:renderBackup})[tab]();}
function renderToday(){const items=planned(date).sort((a,b)=>(a.s.time||'').localeCompare(b.s.time||''));return `<section class="card"><h2>每週課表與點名</h2><label>選擇日期</label><input type="date" id="date" value="${date}" onchange="date=this.value;render()"><div class="days" style="margin-top:12px">${[1,2,3,4,5,6,0].map(d=>`<button class="small ${new Date(date+'T12:00:00').getDay()===d?'active':''}" onclick="pickDay(${d})">週${weekdays[d]}</button>`).join('')}</div><p class="muted">當日 ${items.length} 堂安排，已出席 ${actual(date)} 堂</p></section><section class="card"><h2>${date} 課程</h2>${items.length?items.map(({s,l,fixed})=>`<div class="student"><div class="row"><div><b>${escapeHtml(s.name)}</b> <span class="pill">${escapeHtml(courseName(s))}</span><div class="muted">${escapeHtml(s.time||'未設定時間')} · ${fixed?'固定課':'臨時／補課'} · ${money(s.fee)}/堂</div></div><span class="pill">${l?({present:'已出席',leave:'請假',absent:'缺席',cancel:'取消'}[l.status]||'未點名'):'未點名'}</span></div><div class="actions"><button onclick="mark('${s.id}','present')">✓ 出席</button><button onclick="mark('${s.id}','leave')">請假</button><button onclick="mark('${s.id}','absent')">缺席</button><button onclick="reschedule('${s.id}')">調課／補課</button><button onclick="mark('${s.id}','cancel')">取消</button></div><details style="margin-top:9px"><summary style="cursor:pointer;color:#735b85">個人課堂備忘錄 ${l?.note?'✎':''}</summary><textarea id="personalNote-${s.id}" rows="3" placeholder="本堂練習內容、觀察、下次提醒…">${escapeHtml(l?.note||'')}</textarea><button class="small primary" onclick="savePersonalNote('${s.id}')">儲存個人備忘錄</button></details></div>`).join(''):'<p class="muted">這天還沒有課程，先到「學生管理」新增學生。</p>'}</section><section class="card"><h2>團體課備忘錄</h2><p class="note">依日期、課程大類與子課程分組；同組學生共用一份紀錄。</p>${[...new Map(items.map(({s})=>[noteKey(date,s),s])).entries()].map(([k,s],i)=>`<div class="student"><b>${escapeHtml(courseName(s))}</b><textarea id="groupNote-${i}" rows="3" placeholder="整班課程主題、動作與下次計畫…">${escapeHtml(state.groupNotes[k]||'')}</textarea><button class="small primary" onclick="saveGroupNote(${JSON.stringify(k).replace(/&/g,'&amp;').replace(/'/g,'&#39;')},'groupNote-${i}')">儲存團體備忘錄</button></div>`).join('')||'<p class="muted">當天尚無課程。</p>'}</section><section class="card"><h3>臨時新增一堂課</h3><div class="grid"><select id="extraStudent"><option value="">選擇學生</option>${state.students.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}（${s.type}）</option>`).join('')}</select><button class="primary" onclick="extraLesson()">加入所選日期</button></div><p class="note">臨時課會出現在當天。調課時，原日期會標示取消，不會重複計費。</p></section>`}
function pickDay(d){let x=new Date(date+'T12:00:00');x.setDate(x.getDate()+((d-x.getDay()+7)%7));date=iso(x);render()}function mark(id,status){let l=lessonFor(id,date);if(l)l.status=status;else state.lessons.push({id:uid(),studentId:id,date,status,fee:student(id).fee});save();render()}function extraLesson(){let id=$('extraStudent').value;if(!id)return notify('請先選學生');if(lessonFor(id,date))return notify('這天已有該學生紀錄');state.lessons.push({id:uid(),studentId:id,date,status:'pending',fee:student(id).fee,extra:true});save();render()}function reschedule(id){let next=prompt('請輸入新上課日期（YYYY-MM-DD）',date);if(!next)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(next)||isNaN(new Date(next+'T12:00:00').getTime()))return alert('日期格式不正確');if(lessonFor(id,next))return alert('新日期已有該學生的課程');let old=lessonFor(id,date);if(old)old.status='cancel';else state.lessons.push({id:uid(),studentId:id,date,status:'cancel',fee:student(id).fee});state.lessons.push({id:uid(),studentId:id,date:next,status:'pending',fee:student(id).fee,extra:true});save();notify('已調整到 '+next);render()}
function renderStudents(){const s=editId?student(editId):null;return `<section class="card"><h2>${s?'編輯學生':'新增學生'}</h2><form onsubmit="submitStudent(event)"><div class="grid"><div><label>學生姓名</label><input required name="name" value="${escapeHtml(s?.name||'')}"></div><div><label>課程</label><select name="type">${courseOptions(s?.type||'鋼琴')}</select></div><div><label>細項課程（可自行輸入）</label><input name="subcourse" list="subcourseSuggestions" placeholder="如：輪瑜珈、器械、音缽" value="${escapeHtml(s?.subcourse||'')}"><datalist id="subcourseSuggestions">${[...new Set(state.students.map(x=>x.subcourse).filter(Boolean).concat(['瑜珈','輪瑜珈','器械皮拉提斯','音缽療癒']))].map(x=>`<option value="${escapeHtml(x)}">`).join('')}</datalist></div><div><label>每堂費用（元）</label><input type="number" min="0" required name="fee" value="${s?.fee??1000}"></div><div><label>固定上課時間</label><input type="time" name="time" value="${s?.time||'16:00'}"></div><div class="full"><label>固定上課星期（可複選）</label><div class="row" style="justify-content:flex-start">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" name="days" value="${d}" ${s?.days.includes(d)?'checked':''}>週${weekdays[d]}</label>`).join('')}</div></div><div class="full"><label>學習備註／曲目／色帶</label><textarea name="notes" rows="2">${escapeHtml(s?.notes||'')}</textarea></div></div><div class="actions"><button class="primary" type="submit">${s?'儲存修改':'新增學生'}</button>${s?'<button type="button" onclick="editId=null;render()">取消編輯</button>':''}</div></form></section><section class="card"><h2>課程大類管理</h2><p class="note">可以自行新增、改名。已經有學生的類別不能直接刪除，以免資料遺失。</p>${state.courseTypes.map(t=>`<div class="row student"><b>${escapeHtml(t)}</b><div class="actions"><button class="small" onclick="renameCourseType('${escapeHtml(t).replace(/'/g,'&#39;')}')">改名</button><button class="small danger" onclick="removeCourseType('${escapeHtml(t).replace(/'/g,'&#39;')}')">移除</button></div></div>`).join('')}<button class="primary" onclick="addCourseType()">＋ 新增課程大類</button></section><section class="card"><h2>學生名單（${state.students.length}）</h2>${state.students.length?state.students.map(s=>`<div class="student"><div class="row"><div><b>${escapeHtml(s.name)}</b> <span class="pill">${escapeHtml(courseName(s))}</span> ${s.active===false?'<span class="pill">已停課</span>':''}<div class="muted">週${s.days.map(d=>weekdays[d]).join('、')||'未排固定課'} ${escapeHtml(s.time)} · ${money(s.fee)}/堂</div>${s.notes?`<div class="note">${escapeHtml(s.notes)}</div>`:''}</div><div class="actions"><button onclick="editId='${s.id}';render()">編輯</button><button onclick="toggleStudent('${s.id}')">${s.active===false?'恢復':'停課'}</button><button class="danger" onclick="deleteStudent('${s.id}')">永久刪除</button></div></div></div>`).join(''):'<p class="muted">尚未新增學生。</p>'}</section>`}
function submitStudent(e){e.preventDefault();const f=new FormData(e.target),data={name:String(f.get('name')).trim(),type:f.get('type'),subcourse:String(f.get('subcourse')||'').trim(),fee:Number(f.get('fee')),time:f.get('time'),days:f.getAll('days').map(Number),notes:f.get('notes')};if(editId)Object.assign(student(editId),data);else state.students.push({id:uid(),active:true,...data});editId=null;save();render();notify('學生資料已儲存')}function toggleStudent(id){const s=student(id);s.active=s.active===false;save();render()}
function deleteStudent(id){const s=student(id);if(!s)return;const relatedLessons=state.lessons.filter(l=>l.studentId===id).length,relatedPayments=state.payments.filter(p=>p.studentId===id).length,relatedStamps=state.stampEvents.filter(x=>x.studentId===id).length;const message=`確定永久刪除「${s.name}」嗎？\n\n同時會刪除：\n課程與點名 ${relatedLessons} 筆\n收款 ${relatedPayments} 筆\n印章 ${relatedStamps} 筆\n\n此操作無法復原，建議先到「備份」下載 JSON。`;if(!confirm(message))return;const typed=prompt(`為防止誤刪，請輸入學生姓名「${s.name}」確認永久刪除：`);if(typed!==s.name){if(typed!==null)alert('姓名不符，未刪除任何資料');return;}state.students=state.students.filter(x=>x.id!==id);state.lessons=state.lessons.filter(x=>x.studentId!==id);state.payments=state.payments.filter(x=>x.studentId!==id);state.stampEvents=state.stampEvents.filter(x=>x.studentId!==id);if(editId===id)editId=null;if(selectedStudent===id)selectedStudent=null;save();render();notify('已永久刪除學生及相關紀錄')}
function monthEntries(){let out=[];let [y,m]=month.split('-').map(Number),n=new Date(y,m,0).getDate();for(let i=1;i<=n;i++){let d=`${month}-${pad(i)}`;for(let {s,l} of planned(d)){if(l?.status==='cancel'||l?.status==='leave'||l?.status==='absent')continue;out.push({s,date:d,l,amount:Number(l?.fee??s.fee),status:l?.status||'pending'})}}return out}function renderMoney(){let entries=monthEntries(),groups={};for(let s of state.students)groups[s.id]={s,rows:[],paid:state.payments.filter(p=>p.studentId===s.id&&p.month===month).reduce((a,p)=>a+p.amount,0)};entries.forEach(x=>{if(groups[x.s.id])groups[x.s.id].rows.push(x)});let billed=Object.values(groups).reduce((a,g)=>a+g.rows.reduce((v,r)=>v+r.amount,0),0),received=Object.values(groups).reduce((a,g)=>a+g.paid,0);let earned=entries.filter(e=>e.status==='present').reduce((a,e)=>a+e.amount,0);let byCourse={};entries.forEach(e=>{byCourse[e.s.type]=(byCourse[e.s.type]||0)+e.amount});return `<section class="card"><h2>每月收入統計</h2><label>月份</label><input type="month" value="${month}" onchange="month=this.value;render()"><div class="grid" style="margin-top:13px"><div class="stat">預計應收<b>${money(billed)}</b></div><div class="stat">已上課收入<b>${money(earned)}</b></div><div class="stat">已收款<b>${money(received)}</b></div>${Object.entries(byCourse).map(([t,v])=>`<div class="stat">${escapeHtml(t)}應收<b>${money(v)}</b></div>`).join('')}</div><p class="note">預計應收＝固定課表與額外課堂（扣除已標記取消、請假、缺席）。尚未點名的課仍列入預估；已上課收入只計算已點名「出席」的課程，點名後切換到收入統計即可看到更新；已收款依妳輸入的收款紀錄計算。調課前請記得取消原課。</p></section><section class="card"><h2>學生月費明細</h2>${Object.values(groups).filter(g=>g.rows.length||g.paid).map(g=>{let due=g.rows.reduce((a,r)=>a+r.amount,0);return `<div class="student"><div class="row"><div><b>${escapeHtml(g.s.name)}</b> <span class="pill">${escapeHtml(courseName(g.s))}</span><div class="muted">預計 ${g.rows.length} 堂 · 應收 ${money(due)} · 已收 ${money(g.paid)}</div></div><span class="pill">${g.paid>=due&&due>0?'已繳清':`差額 ${money(due-g.paid)}`}</span></div><div class="actions"><button onclick="recordPayment('${g.s.id}')">＋ 記錄收款</button><button onclick="showDetail('${g.s.id}')">查看堂數</button></div></div>`}).join('')||'<p class="muted">本月沒有排課紀錄。</p>'}</section><section class="card"><h3>收款紀錄</h3>${state.payments.filter(p=>p.month===month).map(p=>`<div class="row student"><span>${escapeHtml(student(p.studentId)?.name||'已移除學生')} · ${escapeHtml(p.date)} · ${money(p.amount)}</span><button class="small danger" onclick="deletePayment('${p.id}')">刪除</button></div>`).join('')||'<p class="muted">尚無收款紀錄</p>'}</section>`}
function recordPayment(id){let s=student(id),amount=prompt(`輸入 ${s.name} ${month} 收到的學費金額（元）`,String(s.fee*4));if(amount===null)return;if(!Number.isFinite(Number(amount))||Number(amount)<=0)return alert('請輸入正確金額');state.payments.push({id:uid(),studentId:id,month,date:today,amount:Number(amount)});save();render()}function deletePayment(id){if(confirm('確定刪除此筆收款？')){state.payments=state.payments.filter(p=>p.id!==id);save();render()}}function showDetail(id){let rows=monthEntries().filter(e=>e.s.id===id);alert(`${student(id).name} ${month} 預計課程：\n`+rows.map(r=>`${r.date} ${r.status==='present'?'已出席':'待點名'} ${money(r.amount)}`).join('\n'))}
function stampCount(id){return state.stampEvents.filter(x=>x.studentId===id).reduce((a,x)=>a+x.delta,0)}function renderStamps(){let tk=state.students.filter(s=>s.type==='跆拳道');return `<section class="card"><h2>跆拳道獎勵印章</h2><p class="muted">累積50個印章兌換禮物。獎勵與點名分開，避免自動加錯印章。</p><label>選擇學生</label><select onchange="selectedStudent=this.value;render()"><option value="">請選擇</option>${tk.map(s=>`<option value="${s.id}" ${selectedStudent===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select>${selectedStudent&&student(selectedStudent)?(()=>{let count=stampCount(selectedStudent),remainder=Math.max(0,count%50);return `<h3>${escapeHtml(student(selectedStudent).name)}：目前 ${count} 個印章</h3><div class="stamps">${Array.from({length:50},(_,i)=>`<div class="stamp ${i<remainder?'on':''}">${i<remainder?'★':i+1}</div>`).join('')}</div><div class="actions"><button onclick="addStamp(1)">＋1</button><button onclick="addStamp(4)">＋4（在家練習）</button><button onclick="addStamp(-1)">－1 修正</button><button class="primary" onclick="redeem()">兌換50個</button></div><p class="note">此畫面以每50個為一輪顯示。兌換時會扣除50個印章，並保留紀錄。</p>`})():''}</section>`}function addStamp(delta){let id=selectedStudent;if(!id)return;if(stampCount(id)+delta<0)return alert('印章不能少於0');state.stampEvents.push({id:uid(),studentId:id,date:today,delta});save();render()}function redeem(){if(stampCount(selectedStudent)<50)return alert('尚未累積50個印章');if(confirm('確定已兌換禮物，扣除50個印章？')){state.stampEvents.push({id:uid(),studentId:selectedStudent,date:today,delta:-50,redeemed:true});save();render()}}
function renderBackup(){return `<section class="card"><h2>資料備份與還原</h2><p>目前資料保存在這台裝置的瀏覽器中，<b>尚未跨裝置同步</b>。請定期下載備份，避免清除瀏覽器資料後遺失。</p><div class="actions"><button class="primary" onclick="exportData()">下載 JSON 備份</button><button onclick="exportCSV()">匯出點名 CSV</button></div><label>從 JSON 備份還原（會取代目前資料）</label><input type="file" accept="application/json,.json" onchange="importData(event)"><p class="note">這個版本不需要帳號、不會將學生資料傳到伺服器。若要 iPhone、電腦同步，需要另外設定登入與雲端資料庫。請勿在共用裝置輸入學生的敏感個資。</p></section>`}function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportData(){download(`sofia-backup-${today}.json`,JSON.stringify(state,null,2),'application/json')}function exportCSV(){let rows=[['日期','學生','課程','狀態','單堂費用']];for(let l of state.lessons){let s=student(l.studentId);rows.push([l.date,s?.name||'',s?.type||'',l.status,l.fee])}download('sofia-attendance.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}async function importData(e){let f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.students)||!Array.isArray(d.lessons)||!Array.isArray(d.payments)||!Array.isArray(d.stampEvents))throw Error();if(!confirm('確定要以備份取代目前全部資料？'))return;state=d;state.courseTypes??=['鋼琴','跆拳道','身體開發'];state.groupNotes??={};save();render();notify('備份已還原')}catch(err){alert('備份格式不正確')}}render();
</script></body></html>
